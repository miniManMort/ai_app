<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    {% include 'header.html' %}
    <main class="page-center">
      <section class="page-card">
        <div class="page-card-header">
          <h1>Edit Task</h1>
          <p>Update task details and save changes to keep your list current.</p>
        </div>

        {% if error %}
          <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="post" class="task-form">
          <label for="summary">Summary</label>
          <input class="form-input" type="text" id="summary" name="summary" value="{{ task.summary }}" autocomplete="off" required>

          <label for="job_id">Job</label>
          <select class="form-input" id="job_id" name="job_id">
            <option value="">No job</option>
            {% for job in jobs %}
              <option value="{{ job.id }}" {% if job_id and job_id|int == job.id %}selected{% endif %}>{{ job.job_name }}</option>
            {% endfor %}
          </select>

          <label for="full_description">Full Description</label>
          <textarea class="form-input" id="full_description" name="full_description" rows="5" autocomplete="off" required>{{ task.full_description }}</textarea>

          <label for="due_date">Due Date</label>
          <input class="form-input" type="date" id="due_date" name="due_date" value="{{ task.due_date }}" autocomplete="off" required>

          <label for="status">Status</label>
          <select class="form-input" id="status" name="status" required>
            {% for status in statuses %}
              <option value="{{ status }}" {% if status == status_value %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
          </select>

          <label for="created_by">Created By</label>
          <input class="form-input" type="text" id="created_by" name="created_by" value="{{ task.created_by.username }}" disabled>

          <label for="assigned_to">Assign To</label>
          <select class="form-input" id="assigned_to" name="assigned_to">
            <option value="" {% if not task.assigned_to %}selected{% endif %}>Unassigned</option>
            {% for user in users %}
              <option value="{{ user.id }}" {% if task.assigned_to and task.assigned_to.id == user.id %}selected{% endif %}>{{ user.username }}</option>
            {% endfor %}
          </select>

          <label for="job_id">Job</label>
          <select class="form-input" id="job_id" name="job_id">
            <option value="">No job</option>
            {% for job in jobs %}
              <option value="{{ job.id }}" {% if job_id and job_id|int == job.id %}selected{% endif %}>{{ job.job_name }}</option>
            {% endfor %}
          </select>

          <button class="button form-button" type="submit">Update Task</button>
        </form>
        <p class="form-footer"><a href="{{ url_for('index') }}">Back to home</a></p>
      </section>
    </main>
  </body>
</html>
