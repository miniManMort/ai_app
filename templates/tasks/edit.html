<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    {% include 'header.html' %}
    <main class="page-center">
      <section class="page-card">
        <div class="page-card-header">
          <h1>Edit Task</h1>
          <p>Update task details and save changes to keep your list current.</p>
        </div>

        {% if error %}
          <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="post" class="task-form">
          <label for="summary">Summary</label>
          <input class="form-input" type="text" id="summary" name="summary" value="{{ task.summary }}" required>

          <label for="full_description">Full Description</label>
          <textarea class="form-input" id="full_description" name="full_description" rows="5" required>{{ task.full_description }}</textarea>

          <label for="due_date">Due Date</label>
          <input class="form-input" type="date" id="due_date" name="due_date" value="{{ task.due_date }}" required>

          <button class="button form-button" type="submit">Update Task</button>
        </form>
      </section>
    </main>
  </body>
</html>
