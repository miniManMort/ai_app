<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="/static/rte.css">
    <script src="/static/rte.js"></script>
  </head>
  <body>
    {% include 'header.html' %}
    <main class="page-center">
      <section class="page-card">
        <div class="page-card-header">
          <h1>Create Task</h1>
          <p>Enter details for the new task and save it to your list.</p>
        </div>

        {% if error %}
          <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="post" class="task-form">
          <label for="summary">Summary</label>
          <input class="form-input" type="text" id="summary" name="summary" autocomplete="off" required>

          <label for="job_id">Job</label>
          <select class="form-input" id="job_id" name="job_id">
            <option value="">No job</option>
            {% for job in jobs %}
              <option value="{{ job.id }}" {% if job_id and job_id|int == job.id %}selected{% endif %}>{{ job.job_name }}</option>
            {% endfor %}
          </select>

          <label for="full_description">Full Description</label>
          <textarea class="rte" id="full_description" name="full_description" rows="5" autocomplete="off" required></textarea>

          <label for="due_date">Due Date</label>
          <input class="form-input" type="date" id="due_date" name="due_date" autocomplete="off" required>

          <label for="status">Status</label>
          <select class="form-input" id="status" name="status" required>
            {% for status in statuses %}
              <option value="{{ status }}" {% if status == status_value %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
          </select>

          <label for="created_by">Created By</label>
          <input class="form-input" type="text" id="created_by" name="created_by" value="{{ username }}" disabled>

          <label for="assigned_to">Assign To</label>
          <select class="form-input" id="assigned_to" name="assigned_to">
            <option value="">Unassigned</option>
            {% for user in users %}
              <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
          </select>

          
          <button class="button form-button" type="submit">Create Task</button>
        </form>
        <p class="form-footer"><a href="{{ url_for('index') }}">Back to home</a></p>
      </section>
    </main>
  </body>
</html>
