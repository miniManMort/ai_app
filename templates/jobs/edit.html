<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit Job</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <link rel="stylesheet" href="/static/rte.css">
    <script src="/static/rte.js"></script>

  </head>
  <body>
    {% include 'header.html' %}
    <main class="page-center">
      <section class="page-card">
        <div class="page-card-header">
          <h1>Edit Job</h1>
          <p>Update job details and save your changes.</p>
        </div>

        {% if error %}
          <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="post" class="task-form">
          <input type="hidden" name="return_url" value="{{ return_url }}">
          <label for="job_name">Job Name</label>
          <input class="form-input" type="text" id="job_name" name="job_name" value="{{ job.job_name }}" autocomplete="off" required>

          <label for="short_code">Short Code</label>
          <input class="form-input" type="text" id="short_code" name="short_code" value="{{ job.short_code }}" autocomplete="off" required>

          <label for="full_description">Full Description</label>
          <textarea class="rte" id="full_description" name="full_description" rows="5" autocomplete="off" required>{{ job.full_description }}</textarea>

          <label for="owner">Owner</label>
          <select class="form-input" id="owner" name="owner" required>
            <option value="">Select owner</option>
            {% for user in users %}
              <option value="{{ user.id }}" {% if owner_id and owner_id|int == user.id %}selected{% endif %}>{{ user.username }}</option>
            {% endfor %}
          </select>

          <button class="button form-button" type="submit">Update Job</button>
        </form>
        <p class="form-footer">
          {% if return_url %}
            <a href="{{ return_url }}">Back to job</a>
          {% else %}
            <a href="{{ url_for('index') }}">Back to home</a>
          {% endif %}
        </p>
      </section>
    </main>
  </body>
</html>
